name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lints run on stable rather than the MSRV. Clippy's lint set shifts between
  # releases, and pinning it to the MSRV means conforming to rules the current
  # toolchain has since dropped. MSRV is still verified, by the test job below.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The first entry must match `rust-version` in Cargo.toml.
        toolchain: ["1.88", stable]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}

      - name: Build
        run: cargo build --locked --all-targets

      - name: Run tests
        run: cargo test
