[package]
name = "miolo"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal viewer for CSV, TSV, JSON and JSONL with long, multi-line text columns"
license = "GPL-3.0-or-later"
repository = "https://github.com/oyarsa/miolo"
readme = "README.md"
keywords = ["csv", "json", "tui", "viewer", "terminal"]
categories = ["command-line-utilities", "text-processing"]
# Development-only material; keep the published crate to what building needs.
exclude = [".github/", "scripts/"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
csv = "1.4.0"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
ratatui = "0.30"
ruzstd = "0.9.0"
serde_json = { version = "1.0.151", features = ["preserve_order", "arbitrary_precision"] }
textwrap = "0.16.2"
thiserror = "2.0.19"
unicode-width = "0.2"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Useful nursery lints
redundant_clone = "warn"
or_fun_call = "warn"
redundant_pub_crate = "warn"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
equatable_if_let = "warn"
fallible_impl_from = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
set_contains_or_insert = "warn"
single_option_map = "warn"
suspicious_operation_groupings = "warn"
too_long_first_doc_paragraph = "warn"
trivial_regex = "warn"

too_many_lines = "allow"
too_many_arguments = "allow"
format_push_string = "allow"
struct_excessive_bools = "allow"
